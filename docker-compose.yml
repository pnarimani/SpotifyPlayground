networks:
  myNetwork:

volumes:
  kafka-1001:
  kafka-1002:
  kafka-1003:
  kafka-2001:
  kafka-2002:
  kafka-2003:
  cassandra-1:
  cassandra-2:
  cassandra-3:
  royalties-postgres-data:

x-common-controller: &controller-defaults
  image: "apache/kafka:latest"
  networks:
    - myNetwork
  healthcheck:
    test:
      [
        "CMD",
        "/opt/kafka/bin/kafka-metadata-quorum.sh",
        "--bootstrap-controller",
        "localhost:9093",
        "describe",
        "--status",
      ]
    start_period: 30s
    interval: 10s
    timeout: 5s
    retries: 3
  environment: &controller-env
    KAFKA_PROCESS_ROLES: controller
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_CONTROLLER_QUORUM_VOTERS: "1001@k-controller-1:9093,1002@k-controller-2:9093,1003@k-controller-3:9093"
    KAFKA_LISTENERS: CONTROLLER://:9093
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT
    KAFKA_LOG_DIRS: /var/lib/kafka/data

x-common-broker: &broker-defaults
  image: "apache/kafka:latest"
  networks:
    - myNetwork
  depends_on:
    k-controller-1:
      condition: service_healthy
    k-controller-2:
      condition: service_healthy
    k-controller-3:
      condition: service_healthy
  healthcheck:
    test:
      [
        "CMD",
        "/opt/kafka/bin/kafka-topics.sh",
        "--bootstrap-server",
        "localhost:9092",
        "--list",
      ]
    start_period: 30s
    interval: 10s
    timeout: 5s
    retries: 3
  environment: &broker-env
    KAFKA_PROCESS_ROLES: broker
    KAFKA_CONTROLLER_QUORUM_VOTERS: "1001@k-controller-1:9093,1002@k-controller-2:9093,1003@k-controller-3:9093"
    KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092
    KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
    KAFKA_LOG_DIRS: /var/lib/kafka/data

x-common-cassandra: &cassandra-defaults
  image: "cassandra:latest"
  networks:
    - myNetwork
  environment:
    CASSANDRA_START_RPC: true
    CASSANDRA_RPC_ADDRESS: 0.0.0.0
    CASSANDRA_LISTEN_ADDRESS: auto
    CASSANDRA_CLUSTER_NAME: my-cluster
    CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
    CASSANDRA_DC: my-datacenter-1
    CASSANDRA_SEEDS: cassandra-1
    MAX_HEAP_SIZE: 512M
    HEAP_NEWSIZE: 128M
  healthcheck:
    test: ["CMD-SHELL", "cqlsh localhost 9042 -e 'describe cluster'"]
    interval: 30s
    start_period: 2m
    timeout: 5s
    retries: 3

services:
  playback:
    build:
      context: ./services
      dockerfile: ./playback/Dockerfile
    networks:
      - myNetwork
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: k-broker-1:29092,k-broker-2:29092,k-broker-3:29092
  recently-played:
    build:
      context: ./services
      dockerfile: ./recently-played/Dockerfile
    networks:
      - myNetwork
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      cassandra-migrate:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: k-broker-1:29092,k-broker-2:29092,k-broker-3:29092
      CASSANDRA_HOSTS: cassandra-1,cassandra-2,cassandra-3
      LOG_LEVEL: debug

  k-controller-1:
    <<: *controller-defaults
    volumes:
      - kafka-1001:/var/lib/kafka/data
    environment:
      <<: *controller-env
      KAFKA_NODE_ID: 1001

  k-controller-2:
    <<: *controller-defaults
    volumes:
      - kafka-1002:/var/lib/kafka/data
    environment:
      <<: *controller-env
      KAFKA_NODE_ID: 1002

  k-controller-3:
    <<: *controller-defaults
    volumes:
      - kafka-1003:/var/lib/kafka/data
    environment:
      <<: *controller-env
      KAFKA_NODE_ID: 1003

  k-broker-1:
    <<: *broker-defaults
    volumes:
      - kafka-2001:/var/lib/kafka/data
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 2001
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://k-broker-1:29092
    ports:
      - "9092:9092"

  k-broker-2:
    <<: *broker-defaults
    volumes:
      - kafka-2002:/var/lib/kafka/data
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 2002
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9093,INTERNAL://k-broker-2:29092
    ports:
      - "9093:9092"

  k-broker-3:
    <<: *broker-defaults
    volumes:
      - kafka-2003:/var/lib/kafka/data
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 2003
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9094,INTERNAL://k-broker-3:29092
    ports:
      - "9094:9092"

  kafka-init:
    image: apache/kafka:latest
    networks:
      - myNetwork
    depends_on:
      k-broker-1:
        condition: service_healthy
      k-broker-2:
        condition: service_healthy
      k-broker-3:
        condition: service_healthy
    entrypoint:
      [
        "/opt/kafka/bin/kafka-topics.sh",
        "--bootstrap-server",
        "k-broker-1:29092",
        "--create",
        "--if-not-exists",
        "--topic",
        "play-events",
        "--partitions",
        "6",
        "--replication-factor",
        "3"
      ]
    restart: "no"

  cassandra-migrate:
    image: "cassandra:latest"
    networks:
      - myNetwork
    restart: "no"
    depends_on:
      cassandra-1:
        condition: service_healthy
      cassandra-2:
        condition: service_healthy
      cassandra-3:
        condition: service_healthy
    volumes:
      - ./services/recently-played/migrations:/migrations:ro
    entrypoint: >
      bash -c "
        cqlsh cassandra-1 9042 -f /migrations/001_create_keyspace.up.cql &&
        cqlsh cassandra-1 9042 -f /migrations/002_create_plays_table.up.cql
      "

  cassandra-1:
    <<: *cassandra-defaults
    ports:
      - 9042:9042
    volumes:
      - cassandra-1:/var/lib/cassandra:rw

  cassandra-2:
    <<: *cassandra-defaults
    depends_on:
      cassandra-1:
        condition: service_healthy
    ports:
      - 9043:9042
    volumes:
      - cassandra-2:/var/lib/cassandra:rw

  cassandra-3:
    <<: *cassandra-defaults
    depends_on:
      cassandra-2:
        condition: service_healthy
    ports:
      - 9044:9042
    volumes:
      - cassandra-3:/var/lib/cassandra:rw

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    networks:
      - myNetwork
    depends_on:
      recently-played:
        condition: service_started
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  royalties-postgres:
    image: postgres:16-alpine
    networks:
      - myNetwork
    environment:
      POSTGRES_DB: royalties
      POSTGRES_USER: royalties
      POSTGRES_PASSWORD: royalties
    ports:
      - "5432:5432"
    volumes:
      - royalties-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U royalties -d royalties"]
      interval: 10s
      timeout: 5s
      retries: 5

  royalties-migrate:
    image: postgres:16-alpine
    networks:
      - myNetwork
    depends_on:
      royalties-postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: royalties
    volumes:
      - ./services/royalties/migrations:/migrations:ro
    entrypoint: >
      sh -c "for f in /migrations/*.up.sql; do
        psql -h royalties-postgres -U royalties -d royalties -f $$f;
      done"
    restart: no

  royalties:
    build:
      context: ./services
      dockerfile: ./royalties/Dockerfile
    networks:
      - myNetwork
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      royalties-migrate:
        condition: service_completed_successfully
    environment:
       KAFKA_BROKERS: k-broker-1:29092,k-broker-2:29092,k-broker-3:29092
       POSTGRES_DSN: postgres://royalties:royalties@royalties-postgres:5432/royalties?sslmode=disable
       LOG_LEVEL: debug
